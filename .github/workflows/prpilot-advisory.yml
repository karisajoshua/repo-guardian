name: PRPilot Advisory Review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  advisory:
    if: startsWith(github.event.pull_request.head.ref, 'repoguardian/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: karisajoshua/Pr-pilot
          ref: main
          path: pr-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: pr-pilot
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: pr-pilot
        run: npm run build
      - name: Post PRPilot advisory
        working-directory: pr-pilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node dist/src/github-runner.js
